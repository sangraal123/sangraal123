name: Deploy Astro Web to GCE

on:
  push:
    branches:
      - main
    paths:
      - 'googja/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./googja

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './googja/package-lock.json'
          
      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Astro project
        run: npm run build

      - name: Copy files to GCE
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          source: "googja/dist"
          target: "/tmp/astro_deploy_home"
          rm: true

      - name: Deploy on GCE
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/home
            sudo rsync -av /tmp/astro_deploy_home/googja/dist/ /var/www/home/
            sudo chown -R www-data:www-data /var/www/home
            rm -rf /tmp/astro_deploy_home
